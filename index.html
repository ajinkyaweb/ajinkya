<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ajinkya — Photographs & Words</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f5f3ee;
      color: #171717;
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.6;
    }

    header {
      padding: 50px 7vw 30px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid #d8d5ce;
    }

    .name {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 20px;
      letter-spacing: 0.18em;
      font-weight: 600;
    }

    .subtitle {
      font-size: 14px;
      color: #666;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 80px 7vw;
    }

    section {
      margin-bottom: 120px;
    }

    h1 {
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(42px, 8vw, 90px);
      font-weight: 400;
      letter-spacing: -0.05em;
      margin-bottom: 50px;
    }

    .intro {
      max-width: 550px;
      font-size: 20px;
      color: #444;
      margin-bottom: 60px;
    }

    .photography {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .photo-placeholder {
      aspect-ratio: 4 / 3;
      background: #dedbd4;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      letter-spacing: 0.1em;
    }

    .writing {
      max-width: 700px;
    }

    article {
      padding: 25px 0;
      border-top: 1px solid #d8d5ce;
    }

    article:last-child {
      border-bottom: 1px solid #d8d5ce;
    }

    article h2 {
      font-size: 25px;
      font-weight: 400;
      margin-bottom: 8px;
    }

    article p {
      color: #666;
      font-size: 15px;
    }

    footer {
      padding: 40px 7vw;
      border-top: 1px solid #d8d5ce;
      color: #777;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
    }

    @media (max-width: 650px) {
      header {
        padding-top: 30px;
        flex-direction: column;
        gap: 5px;
      }

      main {
        padding-top: 50px;
      }

      .photography {
        grid-template-columns: 1fr;
      }

      section {
        margin-bottom: 80px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="name">AJINKYA</div>
    <div class="subtitle">photographs & words</div>
  </header>

  <main>

    <section>
      <h1>Photography</h1>

      <p class="intro">
        Places I've been, things I've noticed, and moments worth keeping.
      </p>

      <div class="photography">

        <div class="photo-placeholder">PHOTO 01</div>
        <div class="photo-placeholder">PHOTO 02</div>
        <div class="photo-placeholder">PHOTO 03</div>
        <div class="photo-placeholder">PHOTO 04</div>

      </div>
    </section>


    <section>
      <h1>Writing</h1>

      <div class="writing">

        <article>
          <h2>First piece</h2>
          <p>A place for thoughts, observations and words.</p>
        </article>

        <article>
          <h2>Another thought</h2>
          <p>More writing will live here.</p>
        </article>

      </div>
    </section>

  </main>

  <footer>
    © 2026 Ajinkya
  </footer>

</body>
</html>

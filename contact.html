<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Ajinkya</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #F4EFEB; 
            --text-color: #111111; 
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 300;
        }

        .top-nav {
            position: absolute;
            top: 30px;
            width: 100%;
        }

        .top-nav a {
            text-decoration: none;
            color: var(--text-color);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid transparent;
            transition: border-bottom 0.3s ease;
        }

        .top-nav a:hover {
            border-bottom: 1px solid var(--text-color);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            margin: 0 0 20px 0;
        }

        p.subtitle {
            font-size: 1.05rem;
            line-height: 1.6;
            margin: 0 auto 60px auto; /* 60px gap before the links */
            color: #444;
            max-width: 450px;
            padding: 0 20px;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Clean, plain text styling for the links */
        .contact-info a {
            font-size: 1.1rem;
            text-decoration: none;
            color: var(--text-color);
            transition: opacity 0.3s ease;
            letter-spacing: 0.5px;
        }

        .contact-info a:hover {
            opacity: 0.5;
        }

        footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <a href="index.html">&larr; Home</a>
    </nav>

    <main>
        <h1>Let's Connect</h1>
        
        <p class="subtitle">It's either three seconds or three business days. Take your chances.</p>
        
        <div class="contact-info">
            <a href="mailto:ajinkyaphotography7@gmail.com">ajinkya.photography7@gmail.com</a>
            <a href="https://instagram.com/ajinkya.nef" target="_blank">ajinkya.nef</a>
        </div>
    </main>

    <footer>
        &copy; 2026 Ajinkya Bhise
    </footer>

</body>
</html>
